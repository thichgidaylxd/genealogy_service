
spring:
  application:
    name: genealogy

  mail:
    host: smtp.gmail.com
    port: 587
    username: lxd0294@gmail.com
    password: garx eggl fock qcad
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000                 # 1 ngày
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - http://127.0.0.1:5500
  frontend-url: http://localhost:5173        # thêm
  cloudinary:                                # thêm
    cloud-name: ${CLOUDINARY_CLOUD_NAME}     # thêm
    api-key: ${CLOUDINARY_API_KEY}           # thêm
    api-secret: ${CLOUDINARY_API_SECRET}     # thêm


server:
  port: 8080